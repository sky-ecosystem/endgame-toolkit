name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

env:
  FOUNDRY_PROFILE: ci
  ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge build (solc 0.6.x)
        env:
          FOUNDRY_PROFILE: 0_6_x
        run: |
          forge build --sizes
        id: build_0_6_x

      - name: Build RewardsBeam test dependency
        env:
          FOUNDRY_PROFILE: 0_8_24
        run: forge build

      - name: Run Forge build (default)
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        env:
          FOUNDRY_TEST: script/dependencies/treasury-funded-farms
        run: |
          forge test -vvv
        id: test
